<!DOCTYPE html>
<html>
<head>
    <title>Pathfinder - Log in</title>
</head>
<body>

    <!-- Temporary login page so any user can log in to use the feed.
         The US1.x stories will replace this with the real login page. -->
    <h1>Log in</h1>

    {% if form.errors %}
        <p>Your username and password didn't match. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <!-- after logging in, go back to the page they were trying to see -->
        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Log in</button>
    </form>
</body>
</html>
