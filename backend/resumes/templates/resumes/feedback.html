<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pathfinder - Resume Feedback</title>

    <style>
        /* Match the login and upload pages */
        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 24px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f4f5f7 50%, #e0f2fe 100%);
            color: #1f2937;
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .card {
            background-color: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .brand {
            margin: 0 0 8px;
            color: #4f46e5;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 21px;
        }

        .resume-name {
            margin: 0 0 26px;
            color: #6b7280;
            overflow-wrap: anywhere;
        }

        .feedback-box {
            padding: 22px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background-color: #f9fafb;
            line-height: 1.6;
        }

        .feedback-box p {
            margin-top: 0;
        }

        .feedback-box p:last-child {
            margin-bottom: 0;
        }

        .warning {
            margin: 22px 0 0;
            padding: 12px 14px;
            border-left: 4px solid #f59e0b;
            border-radius: 6px;
            background-color: #fffbeb;
            color: #92400e;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 14px;
            }

            .card {
                padding: 24px 20px;
            }

            .feedback-box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <a class="back-link" href="{% url 'resumes:upload' %}">
            ← Back to your resumes
        </a>

        <section class="card">
            <p class="brand">Pathfinder</p>
            <h1>AI resume feedback</h1>

            <p class="resume-name">
                Feedback for {{ resume.file.name|cut:"resumes/" }}
            </p>

            <section class="feedback-box">
                <h2>Suggestions</h2>

                {{ feedback|linebreaks }}
            </section>

            <p class="warning">
                AI feedback can make mistakes, so review each suggestion before changing your resume
            </p>
        </section>
    </main>
</body>
</html>
