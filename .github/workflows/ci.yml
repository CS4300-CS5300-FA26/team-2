name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Check and test Django backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite:///db.sqlite3
      SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: pathfinder.settings.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test

  frontend-gateway:
    name: Test frontend gateway routes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend gateway image
        run: docker build --file deployment/frontend.Dockerfile --tag pathfinder-frontend-gateway .

      - name: Run gateway integration test
        run: python .github/scripts/test_gateway.py pathfinder-frontend-gateway