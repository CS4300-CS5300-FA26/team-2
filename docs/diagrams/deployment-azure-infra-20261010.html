<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Diagram Design</p>
    <h1>Pathfinder deployment topology</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pathfinder-deploy-title pathfinder-deploy-desc">
        <title id="pathfinder-deploy-title">Pathfinder deployment topology</title>
        <desc id="pathfinder-deploy-desc">Deployment diagram placing the frontend App Service in the public edge zone, the VNet-integrated backend App Service (Basic B1, 2 instances) and Postgres Flexible Server inside the Azure VNet, and Key Vault and Blob Storage as platform services reached over firewall-gated public endpoints. No container registry: both apps deploy from source via Oryx.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Zones (drawn first, before arrows/nodes) ===== -->
        <!-- Zone 1: Public / edge -->
        <rect x="24" y="40" width="192" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="40" y="44" width="100" height="12" fill="#f5f5f5"/>
        <text x="90" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">PUBLIC / EDGE</text>

        <!-- Zone 2: Azure VNet -->
        <rect x="240" y="40" width="460" height="460" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="256" y="44" width="190" height="12" fill="#f5f5f5"/>
        <text x="351" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">AZURE VNET · 10.0.0.0/16</text>

        <!-- Zone 3: Platform services (public endpoint, firewall-gated) -->
        <rect x="740" y="40" width="276" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="756" y="44" width="150" height="12" fill="#f5f5f5"/>
        <text x="831" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">PLATFORM SERVICES</text>

        <!-- ===== Network paths (before node boxes) ===== -->

        <!-- Frontend App Service -> Backend App Service: cross-zone, CORS/HTTPS boundary -->
        <path d="M200,128 H230 Q238,128 238,136 V172 Q238,180 246,180 H270" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="213" y="146" width="50" height="12" rx="2" fill="#f5f5f5"/>
        <text x="238" y="155" fill="#2e5aa8" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

        <!-- Backend App Service -> Postgres: focal path, no HA (accepted SPOF) -->
        <line x1="470" y1="320" x2="470" y2="356" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="443" y="328" width="54" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="337" fill="#bf4520" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">TLS:5432</text>

        <!-- Backend App Service -> Key Vault: VNet-integration outbound, Key Vault reference resolution -->
        <path d="M670,210 H702 Q710,210 710,218 V230 H756" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
        <rect x="682" y="214" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="223" fill="#2e5aa8" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">TLS:443</text>

        <!-- Backend App Service -> Blob Storage: resume uploads -->
        <path d="M670,260 H702 Q710,260 710,268 V326 H756" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
        <rect x="682" y="296" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="710" y="305" fill="#2e5aa8" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

        <!-- ===== Nodes ===== -->

        <!-- Frontend App Service (public edge) -->
        <rect x="40" y="76" width="160" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="76" width="160" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="82" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="76" y="91" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="120" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Frontend App Service</text>
        <rect x="48" y="126" width="144" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="56" y="142" fill="#2d3142" font-size="12" font-family="var(--font-sans)">app-pathfinder-prod-web</text>
        <text x="184" y="142" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="end">node 20-lts</text>
        <text x="120" y="164" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">React · built from source (Oryx)</text>

        <!-- Backend App Service (VNet-integrated, focal: no HA across instances) -->
        <rect x="270" y="160" width="400" height="160" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="160" width="400" height="160" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="278" y="166" width="56" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="306" y="175" fill="rgba(191,69,32,0.85)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="470" y="198" fill="#bf4520" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Backend App Service</text>
        <text x="470" y="212" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">snet-aks (VNet integration) · Basic B1 · 2 instances</text>
        <rect x="278" y="222" width="384" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="286" y="238" fill="#2d3142" font-size="12" font-family="var(--font-sans)">app-pathfinder-prod-api</text>
        <text x="654" y="238" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="end">python 3.12</text>
        <text x="470" y="262" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">gunicorn :8000 · health check /healthz/ · always_on</text>
        <text x="470" y="278" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">system-assigned identity · Key Vault Secrets User</text>
        <text x="470" y="300" fill="rgba(79,93,117,0.7)" font-size="7.5" font-family="var(--font-mono)" text-anchor="middle">no container registry, Oryx builds straight from source on push</text>

        <!-- Postgres Flexible Server (focal: no HA, accepted SPOF) -->
        <rect x="360" y="356" width="220" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="356" width="220" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="368" y="362" width="56" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="396" y="371" fill="rgba(191,69,32,0.85)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="470" y="394" fill="#bf4520" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Postgres Flexible Server</text>
        <text x="470" y="408" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">snet-data · no HA (accepted SPOF)</text>
        <rect x="368" y="418" width="204" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="376" y="434" fill="#2d3142" font-size="12" font-family="var(--font-sans)">postgres</text>
        <text x="564" y="434" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="end">16</text>
        <text x="470" y="458" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">Burstable B1ms · 32GB</text>

        <!-- Key Vault (security treatment) -->
        <rect x="756" y="76" width="244" height="88" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="764" y="82" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="776" y="91" fill="rgba(191,69,32,0.85)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">KV</text>
        <text x="878" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Key Vault</text>
        <text x="878" y="128" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">@Microsoft.KeyVault(...) app setting refs</text>
        <text x="878" y="142" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">public EP · firewall: snet-aks only</text>

        <!-- Blob Storage (store treatment) -->
        <rect x="756" y="184" width="244" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="764" y="190" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="778" y="199" fill="rgba(79,93,117,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">OBJ</text>
        <text x="878" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Blob Storage</text>
        <text x="878" y="236" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">stpathfinderprodmedia · LRS</text>
        <text x="878" y="250" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" text-anchor="middle">media container · private</text>

        <!-- ===== Legend ===== -->
        <line x1="24" y1="520" x2="1016" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="536" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">LEGEND</text>

        <rect x="40" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="560" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">App Service</text>

        <rect x="180" y="552" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="200" y="560" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">Focal / SPOF</text>

        <rect x="320" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="340" y="560" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">Managed service</text>

        <rect x="480" y="552" width="14" height="10" rx="2" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="500" y="560" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">Secrets / security</text>

        <rect x="660" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="680" y="560" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">Storage / data</text>

        <line x1="40" y1="580" x2="68" y2="580" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="76" y="584" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">in-zone call</text>

        <line x1="200" y1="580" x2="228" y2="580" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="236" y="584" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">cross-zone call</text>

        <line x1="380" y1="580" x2="408" y2="580" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="416" y="584" fill="#4f5d75" font-size="8.5" font-family="var(--font-sans)">focal / SPOF path</text>
      </svg>
    </div>
  </div>
</body>
</html>
