<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Pathfinder deployment architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pathfinder-arch-title pathfinder-arch-desc">
        <title id="pathfinder-arch-title">Pathfinder deployment architecture</title>
        <desc id="pathfinder-arch-desc">GitHub source-deploys the frontend and backend directly to two Azure App Service Web Apps (Oryx build, no container registry); the browser reaches the React frontend on App Service and calls the Django API on the VNet-integrated backend App Service, which reads and writes Postgres, Key Vault, and Blob Storage over the private VNet.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Zones (drawn first, before arrows/nodes) ===== -->
        <!-- Public internet zone: Browser + Frontend App Service -->
        <rect x="24" y="188" width="352" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="140" y="192" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="201" fill="#5a6580" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">PUBLIC INTERNET</text>

        <!-- Azure VNet (private) zone: Backend App Service + Postgres + Key Vault + Storage -->
        <rect x="384" y="108" width="612" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="610" y="112" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="690" y="121" fill="#5a6580" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">AZURE VNET (PRIVATE)</text>

        <!-- ===== Arrows (before node boxes) ===== -->

        <!-- GitHub -> Frontend App Service: source deploy, Oryx build -->
        <path d="M400,48 H340 Q290,48 290,96 V216" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="294" y="140" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="149" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">DEPLOY</text>

        <!-- GitHub -> Backend App Service: source deploy, Oryx build -->
        <path d="M490,76 V216" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="464" y="140" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="149" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">DEPLOY</text>

        <!-- Browser -> Frontend App Service: same row (cy=252), straight -->
        <line x1="180" y1="252" x2="220" y2="252" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Frontend -> Backend App Service: same row, link-blue (CORS/HTTPS boundary) -->
        <line x1="360" y1="252" x2="400" y2="252" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
        <rect x="362" y="232" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="241" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">CORS</text>

        <!-- Backend App Service -> KeyVault: same row (cy=252), straight, security -->
        <line x1="580" y1="252" x2="820" y2="252" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Backend App Service -> Postgres: focal-to-focal, accent, elbow up-right (VNet integration) -->
        <path d="M580,236 H702 Q710,236 710,228 V188 Q710,180 718,180 H820" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="684" y="196" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="710" y="205" fill="#bf4520" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">VNET SQL</text>

        <!-- Backend App Service -> Storage: elbow down-right -->
        <path d="M580,268 H702 Q710,268 710,276 V316 Q710,324 718,324 H820" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="684" y="284" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="699" y="293" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">BLOB</text>

        <!-- ===== Nodes ===== -->

        <!-- GitHub (external) -->
        <rect x="400" y="20" width="140" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="20" width="140" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="408" y="26" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="422" y="35" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="470" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">GitHub</text>
        <text x="470" y="66" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">source deploy, no image</text>

        <!-- Browser (input) -->
        <rect x="40" y="220" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="220" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="235" fill="rgba(90,101,128,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="110" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Browser</text>
        <text x="110" y="270" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">user / signup / upload</text>

        <!-- Frontend App Service -->
        <rect x="220" y="220" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="228" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="242" y="235" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="290" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Frontend App Service</text>
        <text x="290" y="270" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">React · Node 20 LTS Oryx build</text>

        <!-- Backend App Service (focal) -->
        <rect x="400" y="220" width="180" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="408" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="422" y="235" fill="rgba(191,69,32,0.85)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="490" y="252" fill="#bf4520" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Backend App Service</text>
        <text x="490" y="266" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Django · Python 3.12 · VNet-integrated</text>

        <!-- Postgres (focal) -->
        <rect x="820" y="140" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="828" y="146" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="842" y="155" fill="rgba(191,69,32,0.85)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="900" y="176" fill="#bf4520" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Postgres</text>
        <text x="900" y="190" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Flexible Server · no HA</text>

        <!-- Key Vault (security treatment) -->
        <rect x="820" y="220" width="160" height="64" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="828" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="842" y="235" fill="rgba(191,69,32,0.85)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">KV</text>
        <text x="900" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Key Vault</text>
        <text x="900" y="270" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">App setting ref · RBAC-gated</text>

        <!-- Blob Storage (store treatment) -->
        <rect x="820" y="300" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="828" y="306" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="842" y="315" fill="rgba(79,93,117,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">OBJ</text>
        <text x="900" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Blob Storage</text>
        <text x="900" y="350" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">resumes · private</text>

        <!-- ===== Legend ===== -->
        <line x1="30" y1="420" x2="1010" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="436" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">LEGEND</text>
        <line x1="140" y1="432" x2="168" y2="432" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="174" y="436" fill="#4f5d75" font-size="9" font-family="var(--font-mono)">internal call</text>
        <line x1="290" y1="432" x2="318" y2="432" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
        <text x="324" y="436" fill="#4f5d75" font-size="9" font-family="var(--font-mono)">CORS / HTTPS</text>
        <line x1="440" y1="432" x2="468" y2="432" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="474" y="436" fill="#4f5d75" font-size="9" font-family="var(--font-mono)">focal path</text>
        <line x1="580" y1="432" x2="608" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="614" y="436" fill="#4f5d75" font-size="9" font-family="var(--font-mono)">source deploy (CI/CD)</text>
      </svg>
    </div>
  </div>
</body>
</html>
